      - lease
      - utility
      - maintenance
      - appliance
      - home_insurance

  vehicle:
    children:
      - registration
      - insurance
      - service
      - tire
      - warranty
      - recall

  pet:
    children:
      - vet_visit
      - vaccination
      - insurance
      - medication
      - lab
      - invoice

  purchase:
    children:
      - receipt
      - order
      - return
      - warranty
      - delivery

  finance_reference:
    children:
      - statement_notice
      - card_replacement
      - account_notice
      - tax_document_notice

  ignore:
    children:
      - marketing
      - newsletter
      - social
      - generic_promotion
