<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Family OS · 后端只读预览</title>
  <link rel="stylesheet" href="styles.css">
  <script src="h2-translations.js" defer></script>
  <script src="i18n.js" defer></script>
  <script src="snapshot.js" defer></script>
  <script src="presentation.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" id="skip" href="#main">查看后端只读预览</a>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark" aria-hidden="true">f.</span><div>Family OS<small id="tagline"></small></div></div>
      <p class="side-label" id="household"></p>
      <nav id="navigation" aria-label="后端信息分类"></nav>
      <div class="sidebar-bottom"><p id="gap"></p></div>
    </aside>
    <div class="workspace">
      <header class="topbar">
        <div class="offline"><span class="status-dot" aria-hidden="true"></span><span id="notice"></span></div>
        <div class="preferences">
          <label class="persona"><span id="peer-label"></span><select id="peer"><option value="iris">艾瑞丝（虚构）</option><option value="soren">索伦（虚构）</option></select></label>
          <label class="persona"><span id="language-label"></span><select id="language"><option value="zh-CN">简体中文</option><option value="en-US">English</option></select></label>
        </div>
      </header>
      <div class="searchbar"><label id="phase-label" for="phase"></label><select id="phase"><option value="initial">初始共享权限</option><option value="source-revoked">来源权限撤销后</option><option value="publication-revoked">事项共享撤销后</option><option value="observation-only">仅观察记录权限</option></select></div>
      <p id="warning" class="feedback" role="status" aria-live="polite"></p>
      <main id="main" tabindex="-1"><p>正在读取本地虚构预览；此页面不能直接作为生产客户端。</p></main>
      <footer id="footer"></footer>
    </div>
  </div>
  <noscript>此仅含虚构数据的离线预览需要启用 JavaScript。</noscript>
</body>
</html>
